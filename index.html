<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalli Tilli</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- VIEW 1: Landing Page -->
    <div id="view-landing" class="view-container" style="display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 50px;">
        <h1 style="color: white;">Kalli Tilli</h1>
        <div style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px;">
            <input type="text" id="playerName" placeholder="Your Name (Required)">
            <button id="hostBtn" style="background: #4CAF50; color: white;">Create Room</button>
            <hr style="width: 100%;">
            <input type="text" id="joinId" placeholder="Enter Room ID">
            <button id="joinBtn" style="background: #2196F3; color: white;">Join Room</button>
        </div>
    </div>

    <!-- VIEW 2: Waiting Room (Lobby) -->
    <div id="view-lobby" class="view-container" style="display: none; flex-direction: column; align-items: center; width: 100%; max-width: 500px; margin-top: 50px; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 8px;">
        <h2 style="color: white;">Waiting Room</h2>
        <div id="roomIdDisplay" style="margin-bottom: 15px; color: yellow; font-size: 18px; font-weight: bold;"></div>
        
        <div id="lobby-players" style="width: 100%; color: white; display: flex; flex-direction: column; gap: 10px;"></div> 
        
        <button id="startGameBtn" style="display: none; background: #4CAF50; color: white; margin-top: 20px; width: 100%;">Start Game</button>

        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
            <button id="saveBtn" style="background: #607d8b; color: white;">Download Save</button>
            <label for="loadInput" style="background: #795548; color: white; padding: 10px 15px; border-radius: 5px; cursor: pointer;">
                Load Save
            </label>
            <input type="file" id="loadInput" accept=".json" style="display: none;">
        </div>
    </div>

    <!-- VIEW 3: Active Game Board -->
    <div id="view-game" class="view-container" style="display: none; width: 100%; max-width: 900px; flex-direction: column; align-items: center;">
        
        <!-- Game Controls & Info -->
        <div id="controls" style="width: 100%;">
            <div id="phase-display" style="color: white; font-weight: bold; margin-right: auto; width: 100%; text-align: center; margin-bottom: 10px;">Phase: LOBBY</div>
            
            <div id="game-info" style="display: none; width: 100%; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; margin-bottom: 10px; text-align: center;">
                <span id="bid-info"></span><br>
                <span id="trump-info"></span>
            </div>

            <!-- Bidding Phase Input -->
            <div id="bidding-panel" style="display: none; gap: 5px; justify-content: center; margin-bottom: 10px;">
                <input type="number" id="bidAmount" placeholder="Raise Bid" min="80" step="5">
                <button id="submitBidBtn" style="background-color: #4CAF50; color: white;">Raise</button>
                <button id="foldBtn" style="background-color: #f44336; color: white;">Fold</button>
            </div>

            <!-- Trump Selection Input -->
            <div id="trump-panel" style="display: none; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                <div style="color: white; font-weight: bold;">Choose Cart (Trump):</div>
                <select id="trumpSuitSelect" style="padding: 5px; font-size: 16px;">
                    <option value="♠">♠ Spades</option>
                    <option value="♥">♥ Hearts</option>
                    <option value="♦">♦ Diamonds</option>
                    <option value="♣">♣ Clubs</option>
                </select>
                <div style="color: white; font-weight: bold; margin-top: 10px;">Choose Team Cards:</div>
                <div id="team-cards-container" style="display: flex; flex-direction: column; gap: 5px;"></div>
                <button id="setTrumpBtn" style="background-color: #2196F3; color: white; margin-top: 10px;">Confirm & Start</button>
            </div>
            
            <button id="backToLobbyBtn" style="display: none; background: #f44336; color: white; margin-bottom: 10px;">Return to Lobby</button>
        </div>

        <!-- Poker Table Layout -->
        <div id="poker-table">
            <div id="opponents-area"></div>
            <div id="center-board"></div>
            <div id="my-area"></div>
        </div>

        <!-- Scorecard Modal -->
        <div id="scorecard-modal" style="display: none; position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 20px; border-radius: 10px; border: 2px solid #ffd700; z-index: 1000; width: 80%; max-width: 500px; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.8);">
            <h2 id="score-title">Round Over</h2>
            <hr>
            <div style="display: flex; justify-content: space-between; margin: 10px 0;">
                <div style="text-align: left; width: 45%;">
                    <h3 style="color: #ff9800;">🔥 Bidder Team</h3>
                    <div id="bidder-stats"></div>
                    <br>
                    <strong>Total: <span id="bidder-total"></span></strong><br>
                    <small>Target: <span id="bid-target"></span></small>
                </div>
                <div style="border-left: 1px solid gray;"></div>
                <div style="text-align: left; width: 45%; padding-left: 10px;">
                    <h3 style="color: #03a9f4;">🛡️ Defender Team</h3>
                    <div id="defender-stats"></div>
                    <br>
                    <strong>Total: <span id="defender-total"></span></strong>
                </div>
            </div>
            <hr>
            <!-- Moved the back to lobby button into the modal -->
            <button id="modalBackToLobbyBtn" style="display: none; background: #f44336; color: white; width: 100%; margin-top: 10px;">Return to Lobby</button>
        </div>
    </div>

    <!-- Scripts must load in this strict order -->
    <script src="game.js"></script>
    <script src="ui.js"></script>
    <script src="network.js"></script>
</body>
</html>
