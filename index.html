<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="controls">
        <button id="dealBtn">Deal New Hand</button>
        <button id="saveBtn">Save Game State</button>
        <input type="file" id="loadInput" accept=".json">
    </div>

    <div id="game-board">
        <!-- Shared board area will go here in Phase 2 -->
    </div>

    <div id="player-hand">
        <!-- Player's local cards render here -->
    </div>

    <script src="game.js"></script>
</body>
</html>
